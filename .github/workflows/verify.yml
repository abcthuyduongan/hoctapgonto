name: Verify production build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:assets
      - run: npm run build
      - run: npx playwright install msedge
      - run: npx playwright install chrome
      - run: npm run test:online:browser
      - run: npm run package:pilot
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence-node-${{ matrix.node }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
